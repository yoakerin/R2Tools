plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'com.github.dcendents.android-maven'
}

android {
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    
    implementation 'androidx.core:core-ktx:1.6.0'
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.android.material:material:1.3.0'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.3.1'
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.3.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.5.2"

//    compileOnly 'androidx.core:core-ktx:1.7.0'
//    compileOnly 'androidx.appcompat:appcompat:1.3.0'
//    compileOnly 'com.google.android.material:material:1.4.0'
//    compileOnly 'androidx.lifecycle:lifecycle-common-java8:2.3.1'
//    compileOnly "androidx.lifecycle:lifecycle-runtime-ktx:2.3.1"
//    compileOnly "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.5.2"
}