plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'com.github.dcendents.android-maven'
}

android {
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}


dependencies {
    compileOnly project(':r2base')
    
    implementation 'androidx.core:core-ktx:1.5.0'
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'com.google.android.material:material:1.3.0'

    //友盟基础库
    implementation 'com.umeng.umsdk:common:9.7.8'
    implementation 'com.umeng.umsdk:asms:1.8.6'
    //友盟分享库
    implementation 'com.umeng.umsdk:share-core:7.3.5'
    implementation 'com.umeng.umsdk:share-wx:7.3.5'
    implementation 'com.umeng.umsdk:share-sina:7.3.5'
    implementation 'com.umeng.umsdk:share-qq:7.3.5'
    //三方平台必要的库
    implementation(files("libs/open_sdk_3.5.14.4_r377deaa_lite.jar"))
    implementation 'com.tencent.mm.opensdk:wechat-sdk-android:6.8.30'

    implementation('io.github.sinaweibosdk:core:13.10.2') {
        exclude([module: "unspecified"])
    }
}